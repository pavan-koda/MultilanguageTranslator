services:
  translator:
    build: .
    ports:
      - "5000:5000"
    environment:
      - HF_TOKEN=${HF_TOKEN}        # set in .env file or shell before running
    volumes:
      - hf_cache:/root/.cache/huggingface   # HuggingFace model cache (persists between runs)
      - argos_models:/app/models            # Argos translation packages
      - ./glossary_overrides.json:/app/glossary_overrides.json  # user glossary edits
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  hf_cache:
  argos_models:
